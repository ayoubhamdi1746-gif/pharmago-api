name: PharmaGo CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "sqlite+aiosqlite:///./test.db"
  JWT_SECRET: "ci-test-jwt-secret-thats-at-least-32-char!"
  HMAC_SECRET: "ci-test-hmac-secret-thats-at-least-32-char"
  FERNET_KEY: "dGhpcyBpcyBhIHRlc3QgZmVybmV0IGtleS0zMiBjaGFycyE="
  DEV_MODE: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check syntax
        run: |
          python -c "
          import ast, os
          errors = []
          for root, dirs, files in os.walk('app'):
            for f in files:
              if f.endswith('.py'):
                path = os.path.join(root, f)
                try:
                  with open(path) as fh:
                    ast.parse(fh.read())
                except SyntaxError as e:
                  errors.append(f'{path}: {e}')
          if errors:
            for e in errors:
              print(f'SYNTAX ERROR: {e}')
            exit(1)
          print('All files pass syntax check')
          "
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -x
      - name: Smoke test - app boots
        run: |
          python -c "
          from app.main import create_app
          app = create_app()
          routes = [r.path for r in app.routes if hasattr(r, 'path')]
          print(f'App boots with {len(routes)} routes')
          assert len(routes) > 50
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linters
        run: pip install flake8
      - name: Run flake8
        run: flake8 app/ --max-line-length=120 --count --statistics
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pharmago-api .
      - name: Run Docker smoke test
        run: |
          docker run -d --name pharmago-test \
            -e JWT_SECRET="${{ env.JWT_SECRET }}" \
            -e HMAC_SECRET="${{ env.HMAC_SECRET }}" \
            -e FERNET_KEY="${{ env.FERNET_KEY }}" \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            -e DEV_MODE="true" \
            -p 8000:8000 pharmago-api
          sleep 3
          curl -f http://localhost:8000/health || exit 1
          docker stop pharmago-test
          docker rm pharmago-test
