version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pharmago
      POSTGRES_PASSWORD: pharmago_secret
      POSTGRES_DB: pharmago
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmago"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pharmago:pharmago_secret@db:5432/pharmago
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-secret-at-least-32-chars}
      HMAC_SECRET: ${HMAC_SECRET:-change-me-to-a-long-secret-at-least-32-chars}
      FERNET_KEY: ${FERNET_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      KONNECT_API_KEY: ${KONNECT_API_KEY:-}
      KONNECT_WALLET_ID: ${KONNECT_WALLET_ID:-}
      FLOUCI_APP_TOKEN: ${FLOUCI_APP_TOKEN:-}
      FLOUCI_APP_SECRET: ${FLOUCI_APP_SECRET:-}
      DEV_MODE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
